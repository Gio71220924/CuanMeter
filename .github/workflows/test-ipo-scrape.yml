# ponytail: throwaway test — does e-ipo's Cloudflare let a GitHub (Azure) runner
# scrape, or block it like Railway? If this passes, promote to a scheduled
# refresh workflow; if blocked, delete it and refresh stays local.
name: test-ipo-scrape
on: [push, workflow_dispatch]
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install curl_cffi
      - name: scrape and report
        run: |
          python ipo_scrape.py > out.html 2> err.txt || true
          echo "bytes=$(wc -c < out.html)"
          if grep -q 'ipo-list\|data-key=' out.html; then
            echo "RESULT: PASS - Azure runner got real e-ipo content"
          else
            echo "RESULT: BLOCKED - no ipo-list (Cloudflare challenge / empty)"
          fi
          echo "--- stderr ---"; head -c 300 err.txt
          echo "--- html head ---"; head -c 300 out.html
