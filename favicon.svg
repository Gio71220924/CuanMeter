<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#00a86b"/>

  <!-- Candle 1 — short, left -->
  <line x1="13" y1="40" x2="13" y2="60" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity=".7"/>
  <rect x="8" y="46" width="10" height="10" rx="2" fill="white"/>

  <!-- Candle 2 — medium, center -->
  <line x1="32" y1="25" x2="32" y2="58" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity=".7"/>
  <rect x="27" y="31" width="10" height="22" rx="2" fill="white"/>

  <!-- Candle 3 — tall, right (with arrow tip) -->
  <line x1="51" y1="12" x2="51" y2="52" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity=".7"/>
  <rect x="46" y="18" width="10" height="28" rx="2" fill="white"/>
  <!-- arrow tip on tallest candle -->
  <polyline points="47,12 51,7 55,12" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
