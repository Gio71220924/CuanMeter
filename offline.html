<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - StockCalcID</title>
    <meta name="robots" content="noindex, nofollow" />

    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />

    <style>
        body {
            font-family: 'Noto Sans', sans-serif;
        }

        .font-display {
            font-family: 'Manrope', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen flex items-center justify-center px-6">
    <div class="max-w-md w-full text-center">
        <div class="bg-white rounded-3xl shadow-xl p-10">
            <div
                class="w-20 h-20 bg-primary/10 text-primary rounded-full flex items-center justify-center mx-auto mb-6">
                <span class="material-symbols-outlined text-[48px]">cloud_off</span>
            </div>

            <h1 class="text-3xl font-extrabold text-slate-900 mb-4 font-display">
                Anda Sedang Offline
            </h1>

            <p class="text-slate-600 mb-8 leading-relaxed">
                Sepertinya koneksi internet Anda terputus. Beberapa fitur mungkin tidak tersedia saat ini.
            </p>

            <div class="space-y-3">
                <button onclick="window.location.reload()"
                    class="w-full py-3 px-6 bg-primary hover:bg-primary-hover text-white font-bold rounded-xl transition-colors flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined text-[20px]">refresh</span>
                    Coba Lagi
                </button>

                <a href="/"
                    class="block w-full py-3 px-6 bg-slate-100 hover:bg-slate-200 text-slate-900 font-bold rounded-xl transition-colors">
                    Kembali ke Beranda
                </a>
            </div>

            <div class="mt-8 pt-8 border-t border-slate-100">
                <p class="text-sm text-slate-500">
                    <span class="material-symbols-outlined text-[16px] align-middle">info</span>
                    Halaman yang sudah Anda kunjungi sebelumnya masih dapat diakses secara offline.
                </p>
            </div>
        </div>
    </div>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#0ea5e9",
                        "primary-hover": "#0284c7",
                    }
                }
            }
        };
    </script>
</body>

</html>
